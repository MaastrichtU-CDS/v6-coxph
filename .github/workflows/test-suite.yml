name: Test Suite

on:
  push:
    branches: [standard-coxph]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 only: the vantage6 developer tooling (the dev network the
        # integration tests drive) does not work on 3.12; the runtime image
        # itself is built and smoke-tested as 3.12 in the docker job.
        python-version: ["3.10"]
        vantage6-version: ["4.14", "4.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vantage6==${{ matrix.vantage6-version }}
          pip install -e .[dev]

      - name: Run tests
        run: |
          pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[lint]

      - name: Run Black code formatter check
        run: |
          black --fast --check --diff --target-version py310 v6-cox-ph/ tests/

      - name: Run Flake8 linter
        run: |
          flake8 v6-cox-ph/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run MyPy type checker
        run: |
          ln -s v6-cox-ph v6_cox_ph
          mypy v6_cox_ph --ignore-missing-imports --follow-imports=silent
          rm v6_cox_ph

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit pip-audit

      - name: Run Bandit security linter (medium and up)
        run: |
          bandit -r v6-cox-ph/ -ll

      - name: Audit dependencies for known vulnerabilities
        run: |
          # Suppressions live in .pip-audit-ignore with a justification and
          # an expiry date per entry; the same policy as the weekly lock
          # scan in security-scan.yml.
          IGNORES=$(grep -E '^--ignore-vuln' .pip-audit-ignore | tr '\n' ' ')
          # --skip-editable: v6-cox-ph is the algorithm itself, installed
          # editable above and not published on PyPI, so pip-audit cannot
          # resolve it; its third-party dependencies are still audited.
          pip-audit --skip-editable $IGNORES

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: |
          docker build -t v6-cox-ph:ci-test .

      - name: Import smoke test inside the image
        run: |
          docker run --rm --entrypoint python v6-cox-ph:ci-test -c "import importlib; importlib.import_module('v6-cox-ph'); from vantage6.algorithm.tools.wrap import wrap_algorithm; print('import smoke test passed')"
