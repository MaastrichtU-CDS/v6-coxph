name: Weekly Security Scan

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-scan:
    name: pip-audit on the lock file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit the locked runtime dependencies
        run: |
          # Suppressions live in .pip-audit-ignore with a justification and
          # an expiry date per entry; see that file's header.
          IGNORES=$(grep -E '^\-\-ignore-vuln' .pip-audit-ignore | tr '\n' ' ')
          pip-audit -r requirements-lock.txt --strict $IGNORES

  bandit:
    name: Bandit on the source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (medium and up)
        run: |
          bandit -r v6-cox-ph/ -ll

  trivy:
    name: Trivy on the released image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code (full history, to find the latest tag)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine the latest released image
        id: image
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No released tag found; nothing to scan." 
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Deterministic rule (same as release.yaml): the branch whose tip is
          # the tagged commit; fail when none or several match.
          TIP=$(git rev-parse "${TAG}^{commit}")
          BRANCHES=$(git for-each-ref refs/remotes/origin \
            --format='%(refname:lstrip=3) %(objectname)' \
            | awk -v tip="$TIP" '$2 == tip { print $1 }' \
            | grep -v '^HEAD$')
          COUNT=$(printf '%s\n' "$BRANCHES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ] || [ "$COUNT" -gt 1 ]; then
            echo "::error::Could not determine the branch of tag ${TAG} (found: ${BRANCHES:-none})."
            exit 1
          fi
          REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME=$(echo "$BRANCHES" | sed 's/\//-/g')
          echo "image=${REPO_LOWER}-${BRANCH_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        if: steps.image.outputs.skip != 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the released image
        if: steps.image.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-reference: ghcr.io/${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  report:
    name: File a private draft security advisory on failure
    needs: [lock-scan, bandit, trivy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN cannot create repository security advisories:
    # no GITHUB_TOKEN permission covers them (security-events is code
    # scanning only). The job therefore gets no GITHUB_TOKEN permissions and
    # mints a short-lived token from the organisation's GitHub App instead
    # ("Repository security advisories: read and write"); the token is
    # scoped to this repository and revoked when the job ends. The App's
    # client ID is the SECURITY_ADVISORY_APP_CLIENT_ID variable and its
    # private key the SECURITY_ADVISORY_APP_PRIVATE_KEY secret. The advisory
    # is created as a private draft and stays one until a human deliberately
    # publishes it — scan output must never become a public issue.
    permissions: {}
    steps:
      - name: Check that the App credentials are configured
        env:
          CLIENT_ID: ${{ vars.SECURITY_ADVISORY_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.SECURITY_ADVISORY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The SECURITY_ADVISORY_APP_CLIENT_ID variable or the SECURITY_ADVISORY_APP_PRIVATE_KEY secret is not set, so no draft advisory was filed."
            exit 1
          fi

      - name: Mint a short-lived advisory token for this repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_ADVISORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_ADVISORY_APP_PRIVATE_KEY }}
          permission-repository-advisories: write

      - name: Create or update the draft security advisory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS: "lock-scan=${{ needs.lock-scan.result }}, bandit=${{ needs.bandit.result }}, trivy=${{ needs.trivy.result }}"
        run: |
          SUMMARY="Weekly security scan failed"
          RUN_LINE="- ${RUN_URL} (${JOBS})"
          DESCRIPTION="The weekly security scan failed. Each failed run is listed
          below; open a run for the scanner output.

          Policy: triage within one working week. Failures on HIGH/CRITICAL with
          a fix available require a lock/digest bump, rebuild, tests and a patch
          tag; the CVE goes into the CHANGELOG. Suppressions must be committed
          with a justification and an expiry date.

          The affected product and the severity are placeholders the API
          requires; set both during triage. This advisory is a private draft:
          do not publish it before the finding is fixed and released, and never
          mirror it into a public issue.

          Failed runs:

          ${RUN_LINE}"
          # Re-use the open draft so repeated failures append to one advisory
          # instead of piling up new ones.
          GHSA=$(gh api "repos/${GH_REPO}/security-advisories?state=draft&per_page=100" \
            | jq -r --arg summary "$SUMMARY" '[.[] | select(.summary == $summary)] | .[0].ghsa_id // empty')
          if [ -n "$GHSA" ]; then
            CURRENT=$(gh api "repos/${GH_REPO}/security-advisories/${GHSA}" --jq '.description')
            jq -n --arg description "${CURRENT}"$'\n'"${RUN_LINE}" '{description: $description}' \
              | gh api -X PATCH "repos/${GH_REPO}/security-advisories/${GHSA}" --input - --silent
          else
            # The API requires an affected product and a severity; both are
            # placeholders that triage replaces.
            jq -n --arg summary "$SUMMARY" --arg description "$DESCRIPTION" --arg name "$GH_REPO" \
              '{summary: $summary, description: $description, severity: "high",
                vulnerabilities: [{package: {ecosystem: "other", name: $name}}]}' \
              | gh api -X POST "repos/${GH_REPO}/security-advisories" --input - --silent
          fi
